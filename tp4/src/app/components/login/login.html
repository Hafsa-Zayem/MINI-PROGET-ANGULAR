<div class="login-container">
    <div class="login-card">
    <div class="login-header">
        <div class="logo">🛒</div>
        <h1>Welcome Back!</h1>
        <p>Login to access your shopping cart</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="error-message" *ngIf="errorMsg">
            <span class="error-icon">⚠️</span>
            {{ errorMsg}}
        </div>

        <div class="success-message" *ngIf="successMsg">
            <span class="success-icon">✅</span>
            {{successMsg}}
        </div>

        <div  class="form-group">
            <label for="username">username</label>
            <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input 
                type="text"
                name="username"
                [(ngModel)]="username"
                placeholder="Enter your username"
                [disabled]="isLoading"
                required>
            </div>
        </div>

       <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input 
            [type]="showPd ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            [disabled]="isLoading"
            required>
            <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading">
              {{ showPd ? '👁️' : '👁️‍🗨️' }}
            </button>
        </div>
       </div>

       <div class="form-options">
        <label class="checkbox-label">
            <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
       </div>

       <button
       type="submit"
       class="btn-login"
       [disabled]="isLoading">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading" class="loading-spinner">⏳ Logging in...</span>
       </button>
    </form>

    <div class="demo-credentials">
        <p class="demo-title">🎭 Demo Accounts (Click to login):</p>
        <div class="demo-buttons">
            <button
            class="demo-btn"
            (click)="quickLogin('admin', 'admin123')"
            [disabled]="isLoading">
               👑 Admin
               <small>admin / admin123</small>
            </button>
            <button
              class="demo-btn"
             (click)="quickLogin('user', 'user123')"
             [disabled]="isLoading">
              👤 User<br>
             <small>user / user123</small>
           </button>     
        </div>
    </div>
    <div class="signup-link">
        Don't have an account? <a href="#">Sign up</a>
    </div>
    </div>
</div>
